[project]
name = "soutlead"
version = "0.1.0"
description = "Reusable AI-powered customer discovery and outreach backend for validating software products."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "beautifulsoup4>=4.12.0",
  "cryptography>=41.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[project.scripts]
soutlead-api = "app.main:run"
soutlead-worker = "queue.worker:run"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["agent"]

[tool.pytest.ini_options]
pythonpath = ["agent"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
