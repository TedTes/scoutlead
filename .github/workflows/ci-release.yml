name: CI and Railway Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub/Railway environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production

permissions:
  contents: read

concurrency:
  group: scoutlead-release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest

  web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: npm run build

  release:
    name: Migrate and Deploy to Railway (${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
    needs:
      - backend
      - web
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    env:
      RELEASE_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || vars.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE || secrets.RAILWAY_API_SERVICE }}
      RAILWAY_WORKER_SERVICE: ${{ vars.RAILWAY_WORKER_SERVICE || secrets.RAILWAY_WORKER_SERVICE }}
      RAILWAY_WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE || secrets.RAILWAY_WEB_SERVICE }}
      RAILWAY_MIGRATION_DATABASE_URL: ${{ secrets.RAILWAY_MIGRATION_DATABASE_URL || vars.RAILWAY_MIGRATION_DATABASE_URL || secrets.RAILWAY_DATABASE_URL || vars.RAILWAY_DATABASE_URL }}
      PYTHONPATH: agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Railway configuration
        run: |
          echo "GitHub release environment: $RELEASE_ENVIRONMENT"
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT RAILWAY_API_SERVICE RAILWAY_WORKER_SERVICE RAILWAY_WEB_SERVICE RAILWAY_MIGRATION_DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Railway release"
              missing=1
            fi
          done
          if printf '%s' "$RAILWAY_MIGRATION_DATABASE_URL" | grep -q '\.railway\.internal'; then
            echo "::error::RAILWAY_MIGRATION_DATABASE_URL must use Railway Postgres DATABASE_PUBLIC_URL, not the private postgres.railway.internal URL"
            missing=1
          fi
          exit "$missing"

      - name: Set up Python for migrations
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install migration dependencies
        run: python -m pip install -e .

      - name: Set up Node for Railway CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ env.RAILWAY_MIGRATION_DATABASE_URL }}
        run: python -m alembic upgrade head

      - name: Deploy API service
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_API_SERVICE" \
            --ci \
            --message "github:${GITHUB_SHA} api"

      - name: Deploy worker service
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WORKER_SERVICE" \
            --ci \
            --message "github:${GITHUB_SHA} worker"

      - name: Deploy web service
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WEB_SERVICE" \
            --ci \
            --message "github:${GITHUB_SHA} web"
