name: CI and Railway Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub/Railway environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production

permissions:
  contents: read

concurrency:
  group: scoutlead-release-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run backend tests
        run: python -m pytest

  web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web app
        working-directory: web
        run: npm run build

  release:
    name: Migrate and Deploy to Railway (${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
    needs:
      - backend
      - web
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    env:
      RELEASE_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'dev' }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || vars.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || secrets.RAILWAY_ENVIRONMENT }}
      RAILWAY_API_SERVICE: ${{ vars.RAILWAY_API_SERVICE || secrets.RAILWAY_API_SERVICE }}
      RAILWAY_WORKER_SERVICE: ${{ vars.RAILWAY_WORKER_SERVICE || secrets.RAILWAY_WORKER_SERVICE }}
      RAILWAY_WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE || secrets.RAILWAY_WEB_SERVICE }}
      RAILWAY_MIGRATION_DATABASE_URL: ${{ secrets.RAILWAY_MIGRATION_DATABASE_URL || vars.RAILWAY_MIGRATION_DATABASE_URL || secrets.RAILWAY_DATABASE_URL || vars.RAILWAY_DATABASE_URL }}
      PYTHONPATH: agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deployable changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git ls-tree -r --name-only "$after")"
          else
            changed="$(git diff --name-only "$before" "$after")"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed"

          backend=false
          migrations=false
          web=false

          if printf '%s\n' "$changed" | grep -Eq '^(agent/|pyproject\.toml|alembic\.ini|deploy/railway/|scripts/(apply_railway_service_config|railway_up_ci)\.py)'; then
            backend=true
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(agent/db/migrations/|agent/db/models\.py|alembic\.ini)'; then
            migrations=true
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(web/|deploy/railway/|scripts/(apply_railway_service_config|railway_up_ci)\.py)'; then
            web=true
          fi

          release_needed=false
          if [ "$backend" = "true" ] || [ "$migrations" = "true" ] || [ "$web" = "true" ]; then
            release_needed=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"

      - name: Skip Railway release
        if: steps.changes.outputs.release_needed == 'false'
        run: echo "No deployable API, worker, migration, or web changes detected."

      - name: Validate Railway configuration
        if: steps.changes.outputs.release_needed == 'true'
        run: |
          echo "GitHub release environment: $RELEASE_ENVIRONMENT"
          missing=0
          required="RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT"
          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            required="$required RAILWAY_API_SERVICE RAILWAY_WORKER_SERVICE"
          fi
          if [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            required="$required RAILWAY_WEB_SERVICE"
          fi
          if [ "${{ steps.changes.outputs.migrations }}" = "true" ]; then
            required="$required RAILWAY_MIGRATION_DATABASE_URL"
          fi
          for name in $required; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Railway release"
              missing=1
            fi
          done
          if [ "${{ steps.changes.outputs.migrations }}" = "true" ] && printf '%s' "$RAILWAY_MIGRATION_DATABASE_URL" | grep -q '\.railway\.internal'; then
            echo "::error::RAILWAY_MIGRATION_DATABASE_URL must use Railway Postgres DATABASE_PUBLIC_URL, not the private postgres.railway.internal URL"
            missing=1
          fi
          exit "$missing"

      - name: Set up Python for release scripts
        if: steps.changes.outputs.release_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install migration dependencies
        if: steps.changes.outputs.migrations == 'true'
        run: python -m pip install -e .

      - name: Set up Node for Railway CLI
        if: steps.changes.outputs.release_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        if: steps.changes.outputs.release_needed == 'true'
        run: npm install -g @railway/cli

      - name: Link Railway project
        if: steps.changes.outputs.release_needed == 'true'
        run: railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT"

      - name: Apply Railway service config
        if: steps.changes.outputs.release_needed == 'true'
        run: |
          services=()
          if [ "${{ steps.changes.outputs.backend }}" = "true" ]; then
            services+=(--service api --service worker)
          fi
          if [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            services+=(--service web)
          fi
          python scripts/apply_railway_service_config.py "${services[@]}"

      - name: Run database migrations
        if: steps.changes.outputs.migrations == 'true'
        env:
          DATABASE_URL: ${{ env.RAILWAY_MIGRATION_DATABASE_URL }}
        run: python -m alembic upgrade head

      - name: Deploy API service
        if: steps.changes.outputs.backend == 'true'
        timeout-minutes: 10
        run: |
          python scripts/railway_up_ci.py railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_API_SERVICE" \
            --ci \
            --message "github:${GITHUB_SHA} api"

      - name: Deploy worker service
        if: steps.changes.outputs.backend == 'true'
        timeout-minutes: 10
        run: |
          python scripts/railway_up_ci.py railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WORKER_SERVICE" \
            --ci \
            --message "github:${GITHUB_SHA} worker"

      - name: Deploy web service
        if: steps.changes.outputs.web == 'true'
        timeout-minutes: 10
        run: |
          python scripts/railway_up_ci.py railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WEB_SERVICE" \
            --ci \
            --message "github:${GITHUB_SHA} web"
